<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>



    <div class="choice-container">
        <h1>Rock, Paper, Scissors</h1>
        <p>Choose your move:</p>
        <input class="button" id="rockButton" type="button" value="Rock" onclick="playRound('rock');" />
        <input class="button" id="paperButton" type="button" value="Paper" onclick="playRound('paper');" />
        <input class="button" id="scissorsButton" type="button" value="Scissors" onclick="playRound('scissors');" />


    </div>

    <div class="score-container">
        <h2>Score</h2>
        <p id="score">User: 0 | Computer: 0</p>





    </div>

    <script>
        let userScore = 0;
        let computerScore = 0;

        function updateScore(userScore, computerScore) {

            document.getElementById("score").textContent = `User: ${userScore} | Computer: ${computerScore}`;

        }

        function playRound(userInput) {


            let choices = ["rock", "paper", "scissors"];
            let computerChoice = choices[Math.floor(Math.random() * choices.length)];

            if (userInput === computerChoice) {
                alert("It's a tie! You both chose " + userInput + ".");
            } else if (
                (userInput === "rock" && computerChoice === "scissors") ||
                (userInput === "paper" && computerChoice === "rock") ||
                (userInput === "scissors" && computerChoice === "paper")
            ) {
                userScore++;
                updateScore(userScore, computerScore);

                setTimeout(() => {
                    alert("You win! Computer chose " + computerChoice + ".");
                }, 50);
            } else {
                computerScore++;
                updateScore(userScore, computerScore);

                setTimeout(() => {
                    alert("Computer wins! He chose " + computerChoice + ".");
                }, 50);
            }


            checkWinner();
        }

        function resetGame() {
            userScore = 0;
            computerScore = 0;
            updateScore(userScore, computerScore);
        }


        function checkWinner() {
            if (userScore === 5) {

                alert("Congratulations! You won the game!");
                resetGame();

            } else if (computerScore === 5) {
                alert("Computer wins the game! Better luck next time!");
                resetGame();
            }
        }


    </script>

</body>

</html>
